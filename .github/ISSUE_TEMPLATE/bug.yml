name: Site bug
description: Something on the site doesn't work or looks broken.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Android
